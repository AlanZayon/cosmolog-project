name: cosmolog-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmolog
      POSTGRES_PASSWORD: cosmolog
      POSTGRES_DB: cosmolog_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmolog -d cosmolog_dev"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/cosmolog;
      mc anonymous set download local/cosmolog;
      echo minio-init done;
      "

  fake-idp:
    build:
      context: ./apps/fake-idp
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      PORT: "9090"
      OAUTH_CLIENT_ID: cosmolog-local
      OAUTH_CLIENT_SECRET: cosmolog-local-secret
      OAUTH_ISSUER: http://localhost:9090
      APP_PUBLIC_URL: http://localhost:3000
      OAUTH_ALLOWED_REDIRECT_PREFIXES: http://localhost:3000/,http://127.0.0.1:3000/

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - path: ./apps/api/.env.docker
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: postgres://cosmolog:cosmolog@postgres:5432/cosmolog_dev
      MIGRATE_DATABASE_URL: postgres://cosmolog:cosmolog@postgres:5432/cosmolog_dev
      RUN_MIGRATIONS: "true"
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      APP_PUBLIC_URL: http://localhost:3000
      REQUIRE_EMAIL_CONFIRMATION: "true"
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      SES_FROM_EMAIL: noreply@localhost
      S3_BUCKET: cosmolog
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/cosmolog
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      GOOGLE_CLIENT_ID: cosmolog-local
      GOOGLE_CLIENT_SECRET: cosmolog-local-secret
      OAUTH_TOKEN_URL: http://fake-idp:9090/token
      OAUTH_ISSUER: http://localhost:9090
      RUST_LOG: cosmolog_api=debug,tower_http=debug,sqlx=warn
    volumes:
      - ./apps/api:/app
      - api_cargo_target:/app/target
      - api_cargo_registry:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      fake-idp:
        condition: service_started

  web:
    image: node:22-bookworm
    working_dir: /workspace
    # Start as root only to chown named volumes, then drop to node (uid 1000).
    # Avoids EACCES when web_node_modules was previously created as root.
    user: root
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8080
      APP_PUBLIC_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: cosmolog-local
      GOOGLE_AUTHORIZE_URL: http://localhost:9090/authorize
      WATCHPACK_POLLING: "true"
      HOME: /home/node
      npm_config_cache: /home/node/.npm
    volumes:
      - .:/workspace:cached
      - web_node_modules:/workspace/node_modules
      # Keep Docker's Turbopack cache off the host .next tree (avoids permission fights with local npm run dev).
      - web_next:/workspace/.next
    command:
      - bash
      - -c
      - |
        mkdir -p /workspace/node_modules /workspace/.next /home/node/.npm
        chown -R 1000:1000 /workspace/node_modules /workspace/.next /home/node
        exec runuser -u node -- bash -c 'npm ci && npm run dev -- -H 0.0.0.0'
    depends_on:
      - api
      - fake-idp

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - api_cargo_target:/workspace/apps/api/target
      - api_cargo_registry:/usr/local/cargo/registry
      - web_node_modules:/workspace/node_modules
    command: sleep infinity
    environment:
      TEST_DATABASE_URL: postgres://cosmolog:cosmolog@postgres:5432/cosmolog_dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  api_cargo_target:
  api_cargo_registry:
  web_node_modules:
  web_next:
  minio_dev_data:

name: cosmolog-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmolog
      POSTGRES_PASSWORD: cosmolog
      POSTGRES_DB: cosmolog_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmolog -d cosmolog_dev"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - path: ./apps/api/.env.docker
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: postgres://cosmolog:cosmolog@postgres:5432/cosmolog_dev
      MIGRATE_DATABASE_URL: postgres://cosmolog:cosmolog@postgres:5432/cosmolog_dev
      RUN_MIGRATIONS: "true"
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
      RUST_LOG: cosmolog_api=debug,tower_http=debug,sqlx=warn
    volumes:
      - ./apps/api:/app
      - api_cargo_target:/app/target
      - api_cargo_registry:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-bookworm
    working_dir: /workspace
    # Match the WSL host user so bind-mounted files stay owned by alanz (uid 1000).
    user: "1000:1000"
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace:cached
      - web_node_modules:/workspace/node_modules
      # Keep Docker's Turbopack cache off the host .next tree (avoids permission fights with local npm run dev).
      - web_next:/workspace/.next
    command: bash -c "npm ci && npm run dev -- -H 0.0.0.0"
    depends_on:
      - api

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - api_cargo_target:/workspace/apps/api/target
      - api_cargo_registry:/usr/local/cargo/registry
      - web_node_modules:/workspace/node_modules
    command: sleep infinity
    environment:
      TEST_DATABASE_URL: postgres://cosmolog:cosmolog@postgres:5432/cosmolog_dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  api_cargo_target:
  api_cargo_registry:
  web_node_modules:
  web_next:

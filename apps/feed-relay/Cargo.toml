[package]
name = "feed-relay"
version = "0.1.0"
edition = "2021"
description = "Poll event_outbox and publish to RabbitMQ"

[[bin]]
name = "feed-relay"
path = "src/main.rs"

[dependencies]
feed-core = { path = "../../crates/feed-core" }
anyhow = "1.0"
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

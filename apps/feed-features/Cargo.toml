[package]
name = "feed-features"
version = "0.1.0"
edition = "2021"
description = "Consume domain events into Redis Feature Store (DB1)"

[[bin]]
name = "feed-features"
path = "src/main.rs"

[dependencies]
feed-core = { path = "../../crates/feed-core" }
feed-contracts = { path = "../../crates/feed-contracts" }
anyhow = "1.0"
dotenvy = "0.15"
futures-lite = "2"
lapin = "2.5"
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

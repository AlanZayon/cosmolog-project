services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cosmolog
      POSTGRES_PASSWORD: cosmolog
      POSTGRES_DB: cosmolog_test
    ports:
      - "5433:5432"
    # Cap RAM so rustc + Docker do not OOM WSL2 on ~8GB hosts.
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmolog -d cosmolog_test"]
      interval: 2s
      timeout: 5s
      retries: 10

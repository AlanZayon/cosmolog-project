[package]
name = "cosmolog_api"
version = "0.1.0"
edition = "2021"

[lib]
name = "cosmolog_api"
path = "src/lib.rs"

[[bin]]
name = "cosmolog_api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "json", "tls-rustls"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3" }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
governor = { version = "0.8", features = ["std", "dashmap"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Render Blueprint — https://render.com/docs/blueprint-spec
#
# First-time setup:
#   1. Render Dashboard → New → Blueprint → connect this repo
#   2. Set secret env vars when prompted (DATABASE_URL, AUTH_JWT_SECRET, AWS/SES/S3,
#      GOOGLE_CLIENT_ID/SECRET, CORS_ALLOWED_ORIGIN, REDIS_URL)
#   3. Provision a free Render Key Value instance and set REDIS_URL to its internal URL
#      (required when APP_ENV=production for SSE fan-out; single-instance pub/sub is fine)
#   4. Optional: disable "Auto-Deploy" and use the GitHub deploy hook after CI passes
#
# Feed engine is OFF in production (FEATURE_FEED_SOURCE=sql). Workers / RabbitMQ /
# Redis DB1–DB2 stay in docker-compose.dev.yml until the SQL feed becomes a bottleneck.
#
# Deploy hook (Settings → Deploy Hook): add RENDER_DEPLOY_HOOK_URL to GitHub Actions secrets.

services:
  - type: web
    name: cosmolog-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - apps/feed-relay/**
        - apps/feed-features/**
        - apps/feed-rank/**
        - crates/**
        - Cargo.toml
        - Cargo.lock
        - render.yaml
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUST_LOG
        value: cosmolog_api=info,tower_http=info,sqlx=warn
      - key: APP_ENV
        value: production
      - key: FEATURE_FEED_SOURCE
        value: sql
      - key: DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SES_FROM_EMAIL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: LEGACY_SUPABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false

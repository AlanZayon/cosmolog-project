[package]
name = "feed-contracts"
version = "0.1.0"
edition = "2021"
description = "Cosmolog Feed Platform shared contracts (events, bus port, candidates, policy, gateway)"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

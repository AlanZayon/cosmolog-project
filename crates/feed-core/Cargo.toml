[package]
name = "feed-core"
version = "0.1.0"
edition = "2021"
description = "Cosmolog Feed Platform runtime: RabbitMQ, Redis FS/serving, rebuild, hydrate"

[dependencies]
feed-contracts = { path = "../feed-contracts" }
anyhow = "1.0"
async-trait = "0.1"
futures-lite = "2"
lapin = "2.5"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json", "tls-rustls"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

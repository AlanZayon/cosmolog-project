name: API tests

on:
  push:
    branches: [master, main]
    paths:
      - "apps/api/**"
      - "apps/feed-relay/**"
      - "apps/feed-features/**"
      - "apps/feed-rank/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/api-test.yml"
      - ".github/workflows/api-deploy.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/feed-relay/**"
      - "apps/feed-features/**"
      - "apps/feed-rank/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/api-test.yml"
      - ".github/workflows/api-deploy.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TEST_DATABASE_URL: postgres://cosmolog:cosmolog@localhost:5432/cosmolog_test

jobs:
  test:
    name: Rust tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cosmolog
          POSTGRES_PASSWORD: cosmolog
          POSTGRES_DB: cosmolog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmolog -d cosmolog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit
        continue-on-error: true

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-api-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-api-

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: pg_isready -h localhost -p 5432 -U cosmolog -d cosmolog_test
        env:
          PGPASSWORD: cosmolog

      - name: Run tests with coverage
        run: |
          cargo llvm-cov \
            --lcov --output-path lcov.info \
            --summary-only \
            --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 45

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-lcov
          path: apps/api/lcov.info
          retention-days: 14

  # Migrations + Render only on push to default branches (never on PRs).
  migrate-current:
    name: Migrate (current)
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIGRATE_DATABASE_URL
        if: env.MIGRATE_DATABASE_URL == ''
        run: |
          echo "::error::MIGRATE_DATABASE_URL secret is not set — refusing to deploy without running migrations."
          echo "Add the secret (Settings → Secrets and variables → Actions) pointing at the direct"
          echo "Postgres endpoint for the current environment (not a transaction pooler)."
          echo "See apps/api/README.md."
          exit 1

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations (current)
        run: sqlx migrate run --database-url "$MIGRATE_DATABASE_URL"

  migrate-production:
    name: Migrate (production)
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL_PRODUCTION }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIGRATE_DATABASE_URL_PRODUCTION
        if: env.MIGRATE_DATABASE_URL == ''
        run: |
          echo "::error::MIGRATE_DATABASE_URL_PRODUCTION secret is not set — refusing to deploy without migrating production."
          echo "Add the secret (Settings → Secrets and variables → Actions) pointing at the direct"
          echo "Postgres endpoint for production (not a transaction pooler)."
          echo "See apps/api/README.md."
          exit 1

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations (production)
        run: sqlx migrate run --database-url "$MIGRATE_DATABASE_URL"

  deploy:
    name: Deploy to Render
    needs: [migrate-current, migrate-production]
    if: >
      always() &&
      github.event_name == 'push' &&
      needs.migrate-current.result == 'success' &&
      needs.migrate-production.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: api-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip deploy (missing secret)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy."
          echo "Use Render auto-deploy from Git, or add a Deploy Hook secret."
          echo "See apps/api/README.md and render.yaml."

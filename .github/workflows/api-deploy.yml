name: Migrate + Deploy API

# Runs on every push to main/master (no path filters) so DB migrations are not
# skipped when only the web app or docs change. Vercel deploys independently.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  migrate-hmg:
    name: Migrate (hmg)
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIGRATE_DATABASE_URL
        if: env.MIGRATE_DATABASE_URL == ''
        run: |
          echo "::error::MIGRATE_DATABASE_URL secret is not set — refusing to continue without HMG migrations."
          echo "Add the secret (Settings → Secrets and variables → Actions) pointing at the direct"
          echo "Postgres endpoint for homologation (not a transaction pooler)."
          echo "See apps/api/README.md."
          exit 1

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations (hmg)
        run: sqlx migrate run --database-url "$MIGRATE_DATABASE_URL"

  migrate-production:
    name: Migrate (production)
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL_PRODUCTION }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIGRATE_DATABASE_URL_PRODUCTION
        if: env.MIGRATE_DATABASE_URL == ''
        run: |
          echo "::error::MIGRATE_DATABASE_URL_PRODUCTION secret is not set — refusing to continue without migrating production."
          echo "Add the secret (Settings → Secrets and variables → Actions) pointing at the direct"
          echo "Postgres endpoint for production (not a transaction pooler)."
          echo "See apps/api/README.md."
          exit 1

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations (production)
        run: sqlx migrate run --database-url "$MIGRATE_DATABASE_URL"

  deploy:
    name: Deploy to Render (hmg + production)
    runs-on: ubuntu-latest
    needs: [migrate-hmg, migrate-production]
    if: >
      always() &&
      needs.migrate-hmg.result == 'success' &&
      needs.migrate-production.result == 'success'
    concurrency:
      group: api-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK_URL_PRODUCTION: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PRODUCTION }}

    steps:
      - name: Require both Render deploy hooks
        if: env.RENDER_DEPLOY_HOOK_URL == '' || env.RENDER_DEPLOY_HOOK_URL_PRODUCTION == ''
        run: |
          echo "::error::Both RENDER_DEPLOY_HOOK_URL (HMG) and RENDER_DEPLOY_HOOK_URL_PRODUCTION are required."
          echo "Render Dashboard → each API service → Settings → Deploy Hook → copy URL into GitHub Actions secrets."
          echo "See apps/api/README.md and render.yaml."
          exit 1

      - name: Trigger Render deploy (hmg)
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Render deploy (production)
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL_PRODUCTION"

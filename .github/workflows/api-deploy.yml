name: Deploy API

# Manual / on-demand migrate + Render deploy (same steps as post-test jobs in
# "API tests"). Prefer pushing API changes so tests run first; use this when you
# only need to re-run migrations or trigger Render without a code change.
on:
  workflow_dispatch:

jobs:
  migrate-current:
    name: Migrate (current)
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIGRATE_DATABASE_URL
        if: env.MIGRATE_DATABASE_URL == ''
        run: |
          echo "::error::MIGRATE_DATABASE_URL secret is not set — refusing to deploy without running migrations."
          echo "Add the secret (Settings → Secrets and variables → Actions) pointing at the direct"
          echo "Postgres endpoint for the current environment (not a transaction pooler)."
          echo "See apps/api/README.md."
          exit 1

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations (current)
        run: sqlx migrate run --database-url "$MIGRATE_DATABASE_URL"

  migrate-production:
    name: Migrate (production)
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL_PRODUCTION }}
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIGRATE_DATABASE_URL_PRODUCTION
        if: env.MIGRATE_DATABASE_URL == ''
        run: |
          echo "::error::MIGRATE_DATABASE_URL_PRODUCTION secret is not set — refusing to deploy without migrating production."
          echo "Add the secret (Settings → Secrets and variables → Actions) pointing at the direct"
          echo "Postgres endpoint for production (not a transaction pooler)."
          echo "See apps/api/README.md."
          exit 1

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations (production)
        run: sqlx migrate run --database-url "$MIGRATE_DATABASE_URL"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [migrate-current, migrate-production]
    if: >
      always() &&
      needs.migrate-current.result == 'success' &&
      needs.migrate-production.result == 'success'
    concurrency:
      group: api-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip deploy (missing secret)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping deploy."
          echo "Use Render auto-deploy from Git, or add a Deploy Hook secret."
          echo "See apps/api/README.md and render.yaml."
